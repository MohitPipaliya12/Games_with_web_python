<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Hub</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Animated Stars Background -->
    <div class="stars"></div>

    <!-- Main Content -->
    <div class="container">

        <h1>🎮 Game Hub 🎮</h1>

        <div class="button-container">

            <!-- Available Games -->

            <form action="/play1">
                <button type="submit">Snake Game</button>
            </form>

            <form action="/play2">
                <button type="submit">Tic Tac Toe</button>
            </form>

            <form action="/play3">
                <button type="submit">Ultimate Tic Tac Toe</button>
            </form>

            <form action="/play4">
                <button type="submit">Dot & Boxes</button>
            </form>


            <!-- Upcoming Games -->

            <div class="upcoming-title">
                🚧 Upcoming Games 🚧
            </div>

            <form action="/play5">
                <button type="submit" class="upcoming-button">
                    Chess
                </button>
            </form>

            <form action="/play6">
                <button type="submit" class="upcoming-button">
                    Connect Four
                </button>
            </form>

            <form action="/play7">
                <button type="submit" class="upcoming-button">
                    Rock Paper Scissors
                </button>
            </form>

            <form action="/play8">
                <button type="submit" class="upcoming-button">
                    Memory Game
                </button>
            </form>

            <form action="/play9">
                <button type="submit" class="upcoming-button">
                    Hangman
                </button>
            </form>

            <form action="/play10">
                <button type="submit" class="upcoming-button">
                    Minesweeper
                </button>
            </form>

        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>
            Made by
            <a href="https://github.com/MohitPipaliya12" target="_blank">
                Mohit Pipaliya
            </a>
        </p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
