<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Snake Game</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        body {
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #101414,
                    #263238
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =========================
           TITLE
        ========================= */

        h1 {

            font-size:
                clamp(24px, 6vw, 42px);

            color: #39ff14;

            text-align: center;

            margin-bottom: 5px;

            text-shadow:
                0 0 10px #39ff14,
                0 0 25px #39ff14;
        }


        /* =========================
           SCORE
        ========================= */

        #score {

            font-size:
                clamp(16px, 4vw, 22px);

            font-weight: bold;

            margin-bottom: 8px;
        }


        /* =========================
           CANVAS
        ========================= */

        #gameCanvas {

            display: block;

            background: #111;

            border:
                3px solid #39ff14;

            box-shadow:
                0 0 12px #39ff14,
                0 0 25px
                rgba(57, 255, 20, 0.4);

            max-width: 90vw;
            max-height: 55vh;

            touch-action: none;
        }


        /* =========================
           CONTROLS
        ========================= */

        #controls {

            display: grid;

            grid-template-columns:
                clamp(50px, 16vw, 70px)
                clamp(50px, 16vw, 70px)
                clamp(50px, 16vw, 70px);

            grid-template-rows:
                clamp(50px, 12vw, 65px)
                clamp(50px, 12vw, 65px);

            gap: 5px;

            margin-top: 8px;
        }


        .control {

            width: 100%;
            height: 100%;

            border:
                2px solid #39ff14;

            border-radius: 10px;

            background: #263238;

            color: #39ff14;

            font-size:
                clamp(22px, 7vw, 30px);

            font-weight: bold;

            cursor: pointer;

            touch-action: manipulation;

            user-select: none;

            -webkit-user-select: none;

            box-shadow:
                0 0 8px
                rgba(57, 255, 20, 0.4);
        }


        .control:active {

            background: #39ff14;

            color: #111;

            transform: scale(0.90);
        }


        #up {
            grid-column: 2;
            grid-row: 1;
        }


        #left {
            grid-column: 1;
            grid-row: 2;
        }


        #down {
            grid-column: 2;
            grid-row: 2;
        }


        #right {
            grid-column: 3;
            grid-row: 2;
        }


        /* =========================
           GAME OVER
        ========================= */

        #gameOver {

            display: none;

            position: absolute;

            z-index: 20;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width:
                min(85vw, 350px);

            padding: 25px;

            text-align: center;

            background:
                rgba(0, 0, 0, 0.96);

            border:
                2px solid #39ff14;

            border-radius: 15px;

            box-shadow:
                0 0 30px
                rgba(57, 255, 20, 0.6);
        }


        #gameOver h2 {

            color: #ff3333;

            font-size: 32px;

            margin-bottom: 15px;

            text-shadow:
                0 0 10px red;
        }


        #gameOver p {

            font-size: 20px;

            margin-bottom: 15px;
        }


        #finalScore {

            color: #39ff14;

            font-size: 24px;
        }


        /* =========================
           RESTART
        ========================= */

        #restartButton {

            padding:
                12px 25px;

            border: none;

            border-radius: 10px;

            background: #4caf50;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            touch-action: manipulation;
        }


        #restartButton:active {

            transform: scale(0.92);
        }


        /* =========================
           BOTTOM
        ========================= */

        .instructions {

            font-size: 11px;

            color: #999;

            margin-top: 5px;
        }


        .back {

            font-size: 14px;

            color: #00ff99;

            text-decoration: none;

            font-weight: bold;

            margin-top: 4px;
        }


        /* =========================
           SMALL SCREEN
        ========================= */

        @media (max-height: 600px) {

            h1 {
                font-size: 24px;
            }

            #score {
                font-size: 16px;
            }

            #gameCanvas {
                max-height: 48vh;
            }

            #controls {
                margin-top: 4px;
            }

            .instructions,
            .back {
                display: none;
            }
        }


        /* =========================
           LANDSCAPE
        ========================= */

        @media
        (orientation: landscape)
        and (max-height: 600px) {

            body {

                flex-direction: row;

                flex-wrap: wrap;

                align-content: center;

                gap: 5px;
            }


            h1 {

                width: 100%;

                font-size: 22px;
            }


            #score {

                width: 100%;

                text-align: center;
            }


            #gameCanvas {

                max-height: 70vh;

                max-width: 55vw;
            }


            #controls {

                margin-left: 8px;
            }
        }

    </style>

</head>


<body>
    <!-- TITLE -->
    <h1> 🐍 Snake Game </h1>

    <!-- SCORE -->
    <div id="score">
        Score:
        <span id="scoreValue">
            0
        </span>
    </div>

    <!-- GAME -->
    <canvas
        id="gameCanvas"
        width="400"
        height="400">
    </canvas>

    <!-- CONTROLS -->
    <div id="controls">
        <button
            class="control"
            id="up"
            type="button">
            ↑
        </button>

        <button
            class="control"
            id="left"
            type="button">
            ←
        </button>

        <button
            class="control"
            id="down"
            type="button">
            ↓
        </button>

        <button
            class="control"
            id="right"
            type="button">
            →
        </button>
    </div>

    <!-- GAME OVER -->
    <div id="gameOver">
        <h2> GAME OVER </h2>
        <p>
            Final Score:
            <strong id="finalScore">
                0
            </strong>
        </p>

        <button
            id="restartButton"
            type="button">
            🔄 Restart
        </button>
    </div>

    <div class="instructions">
        Arrow Keys / WASD / Touch Buttons
    </div>

    <a
        class="back"
        href="/">
        ← Back to Home
    </a>

    <script>
        const canvas =
            document.getElementById(
                "gameCanvas"
            );

        const ctx =
            canvas.getContext("2d");

        const scoreElement =
            document.getElementById(
                "scoreValue"
            );

        const controls =
            document.getElementById(
                "controls"
            );

        const gameOverElement =
            document.getElementById(
                "gameOver"
            );

        const finalScoreElement =
            document.getElementById(
                "finalScore"
            );

        const restartButton =
            document.getElementById(
                "restartButton"
            );

        const GRID = 12;
        let cellSize;
        let snake = [];
        let food = null;
        let direction = "RIGHT";
        let nextDirection = "RIGHT";
        let score = 0;
        let gameOver = false;
        let timer = null;

        /* =========================
           CANVAS SIZE
        ========================= */

        function resizeCanvas() {
            const availableWidth = window.innerWidth * 0.90;
            const availableHeight = window.innerHeight * 0.55;

            const size =
                Math.min(
                    availableWidth,
                    availableHeight,
                    500
                );

            const finalSize =
                Math.floor(
                    size / GRID
                ) * GRID;

            canvas.width = finalSize;
            canvas.height = finalSize;
            cellSize = finalSize / GRID;

            draw();
        }


        /* =========================
           START GAME
        ========================= */

        function startGame() {

            // Fixed starting position
            const center = Math.floor(GRID / 2);

            snake = [
                { x: center,     y: center },
                { x: center - 1, y: center },
                { x: center - 2, y: center }
            ];

            // Initial direction
            direction = "RIGHT";
            nextDirection = "RIGHT";

            // Initial score
            score = 0;

            // Game state
            gameOver = false;

            // Show score
            scoreElement.textContent = score;

            // Show controls
            controls.style.display = "grid";

            // Hide Game Over screen
            gameOverElement.style.display = "none";

            // Create food
            createFood();

            // Start game
            clearInterval(timer);

            timer = setInterval(update, 200);

            // Draw
            draw();
        }

        /* =========================
           CREATE FOOD
        ========================= */

        function createFood() {

            do {

                food = {

                    x:
                        Math.floor(
                            Math.random() *
                            GRID
                        ),

                    y:
                        Math.floor(
                            Math.random() *
                            GRID
                        )

                };

            } while (

                snake.some(
                    part =>
                        part.x === food.x &&
                        part.y === food.y
                )

            );
        }


        /* =========================
           DIRECTION
        ========================= */

        function changeDirection(
            newDirection
        ) {

            if (
                newDirection === "UP" &&
                nextDirection !== "DOWN"
            ) {

                nextDirection = "UP";
            }


            else if (
                newDirection === "DOWN" &&
                nextDirection !== "UP"
            ) {

                nextDirection = "DOWN";
            }


            else if (
                newDirection === "LEFT" &&
                nextDirection !== "RIGHT"
            ) {

                nextDirection = "LEFT";
            }


            else if (
                newDirection === "RIGHT" &&
                nextDirection !== "LEFT"
            ) {

                nextDirection = "RIGHT";
            }
        }


        /* =========================
           UPDATE GAME
        ========================= */

        function update() {

            if (gameOver) {
                return;
            }


            direction =
                nextDirection;


            const head = {

                x: snake[0].x,

                y: snake[0].y

            };


            if (direction === "UP") {
                head.y--;
            }


            if (direction === "DOWN") {
                head.y++;
            }


            if (direction === "LEFT") {
                head.x--;
            }


            if (direction === "RIGHT") {
                head.x++;
            }


            /*
             * WALL COLLISION
             */

            if (

                head.x < 0 ||
                head.x >= GRID ||
                head.y < 0 ||
                head.y >= GRID

            ) {

                endGame();

                return;
            }


            /*
             * SNAKE COLLISION
             */

            if (

                snake.some(
                    part =>
                        part.x === head.x &&
                        part.y === head.y
                )

            ) {

                endGame();

                return;
            }


            snake.unshift(head);


            /*
             * FOOD
             */

            if (

                head.x === food.x &&
                head.y === food.y

            ) {

                score += 10;


                scoreElement.textContent =
                    score;


                createFood();

            }

            else {

                snake.pop();

            }


            draw();
        }


        /* =========================
           DRAW
        ========================= */

        function draw() {

            if (!cellSize) {
                return;
            }


            /*
             * BACKGROUND
             */

            ctx.fillStyle =
                "#111";


            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * GRID
             */

            ctx.strokeStyle =
                "rgba(255,255,255,0.04)";


            for (
                let i = 0;
                i <= GRID;
                i++
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    i * cellSize,
                    0
                );

                ctx.lineTo(
                    i * cellSize,
                    canvas.height
                );

                ctx.stroke();


                ctx.beginPath();

                ctx.moveTo(
                    0,
                    i * cellSize
                );

                ctx.lineTo(
                    canvas.width,
                    i * cellSize
                );

                ctx.stroke();
            }


            /*
             * FOOD
             */

            if (food) {

                ctx.fillStyle =
                    "#ff3333";


                ctx.shadowColor =
                    "#ff0000";


                ctx.shadowBlur = 15;


                ctx.beginPath();


                ctx.arc(

                    food.x * cellSize +
                        cellSize / 2,

                    food.y * cellSize +
                        cellSize / 2,

                    cellSize * 0.35,

                    0,
                    Math.PI * 2

                );


                ctx.fill();


                ctx.shadowBlur = 0;
            }


            /*
             * SNAKE
             */

            snake.forEach(

                (part, index) => {

                    ctx.fillStyle =
                        index === 0
                            ? "#7CFF00"
                            : "#39ff14";


                    ctx.shadowColor =
                        "#39ff14";


                    ctx.shadowBlur = 8;


                    ctx.fillRect(

                        part.x * cellSize + 1,

                        part.y * cellSize + 1,

                        cellSize - 2,

                        cellSize - 2

                    );


                    ctx.shadowBlur = 0;
                }
            );
        }


        /* =========================
           GAME OVER
        ========================= */

        function endGame() {

            gameOver = true;


            clearInterval(timer);

            timer = null;


            /*
             * Hide controls
             */

            // controls.style.display =
            //     "none";


            /*
             * Show game-over screen
             */

            finalScoreElement.textContent =
                score;


            gameOverElement.style.display =
                "block";
        }


        /* =========================
           MOBILE BUTTONS
        ========================= */

        function setupButton(
            id,
            directionName
        ) {

            const button =
                document.getElementById(id);


            button.addEventListener(
                "pointerdown",
                function(event) {

                    event.preventDefault();


                    if (!gameOver) {

                        changeDirection(
                            directionName
                        );

                    }

                }
            );
        }


        setupButton(
            "up",
            "UP"
        );


        setupButton(
            "down",
            "DOWN"
        );


        setupButton(
            "left",
            "LEFT"
        );


        setupButton(
            "right",
            "RIGHT"
        );


        /* =========================
           RESTART
        ========================= */

        restartButton.addEventListener(
            "pointerdown",
            function(event) {

                event.preventDefault();

                startGame();

            }
        );


        /* =========================
           KEYBOARD
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                const key =
                    event.key.toLowerCase();


                if (
                    key === "arrowup" ||
                    key === "w"
                ) {

                    event.preventDefault();

                    changeDirection("UP");
                }


                else if (
                    key === "arrowdown" ||
                    key === "s"
                ) {

                    event.preventDefault();

                    changeDirection("DOWN");
                }


                else if (
                    key === "arrowleft" ||
                    key === "a"
                ) {

                    event.preventDefault();

                    changeDirection("LEFT");
                }


                else if (
                    key === "arrowright" ||
                    key === "d"
                ) {

                    event.preventDefault();

                    changeDirection("RIGHT");
                }

            }
        );


        /* =========================
           RESIZE
        ========================= */

        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /* =========================
           START
        ========================= */

        resizeCanvas();

        startGame();

    </script>

</body>

</html>
